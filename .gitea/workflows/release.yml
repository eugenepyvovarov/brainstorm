name: Release Brainstorm

"on":
  workflow_dispatch:

permissions:
  contents: write

# One job on purpose: Gitea Actions often fails to pass needs.*.outputs between
# jobs (empty version → Homebrew step dies after a good release). Sequential
# steps share the runner workspace and the release.json version reliably.
jobs:
  release:
    runs-on: macos-ultramac
    timeout-minutes: 60
    env:
      BRAINSTORM_GITEA_SERVER_URL: https://git.ultramac.work
      BRAINSTORM_GITEA_REPOSITORY: lifeisgoodlabs/brainstorm-macos
      BRAINSTORM_GITHUB_REPOSITORY: eugenepyvovarov/brainstorm
      BRAINSTORM_CODE_SIGN_IDENTITY: "Developer ID Application: Ievgen Pyvovarov (VXRLZNZH2E)"
      NOTARIZE_APP: "true"
      REQUIRE_NOTARIZATION: "true"
      NOTARYTOOL_PROFILE: mcp-bundler-notary
      BRAINSTORM_GITEA_TOKEN: ${{ secrets.BRAINSTORM_GITEA_TOKEN }}
      BRAINSTORM_GITHUB_TOKEN: ${{ secrets.BRAINSTORM_GITHUB_TOKEN }}
      HOMEBREW_TAP_REPOSITORY: eugenepyvovarov/homebrew-cask
      HOMEBREW_TAP_UPSTREAM: Homebrew/homebrew-cask
      BRAINSTORM_HOMEBREW_TOKEN: ${{ secrets.BRAINSTORM_HOMEBREW_TOKEN }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BRAINSTORM_GITEA_TOKEN }}

      - name: Build, sign, and package one release artifact
        run: RELEASE_BUILD="${{ gitea.run_number }}" scripts/release/build-release.sh

      - name: Publish the same archive to Gitea and GitHub Releases
        run: |
          set -euo pipefail
          manifest="$(find dist -maxdepth 2 -name release.json -print -quit)"
          test -n "$manifest"
          scripts/release/publish-release.sh "$manifest"

      - name: Sync tap and publish Homebrew Cask for this release
        run: |
          set -euo pipefail
          manifest="$(find dist -maxdepth 2 -name release.json -print -quit)"
          test -n "$manifest"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[1-9][0-9]*$ ]]
          printf 'Updating Homebrew Cask for Brainstorm %s\n' "$version"
          scripts/release/publish-homebrew-cask.sh "$version"
